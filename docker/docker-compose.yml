services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: dify-workflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    volumes:
      # 初始化SQL脚本
      - ./dify_workflow_config.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # 数据持久化
      - mysql_data:/var/lib/mysql
      # MySQL配置
      - ./mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    networks:
      - dify-workflow-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  # 应用服务（前后端一体）
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      pull: false
    container_name: dify-workflow-app
    restart: unless-stopped
    environment:
      # 数据库配置
      CONFIG_DB_HOST: mysql
      CONFIG_DB_PORT: 3306
      CONFIG_DB_DATABASE: ${MYSQL_DATABASE}
      CONFIG_DB_USERNAME: ${MYSQL_USERNAME:-root}
      CONFIG_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      
      # JWT 配置
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRES_DAYS: ${JWT_EXPIRES_DAYS:-7}
      JWT_ISSUER: ${JWT_ISSUER:-dify-workflow-exporter}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      
      # 应用配置
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: ${FLASK_PORT:-5001}
      
      # Gunicorn 配置
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      
      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # 时区
      TZ: Asia/Shanghai
    volumes:
      # 日志持久化
      - app_logs:/app/logs
      # 配置文件（可选，如果需要覆盖）
      - ../config.yaml:/app/config.yaml:ro
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - dify-workflow-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dify-workflow-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  app_logs:
    driver: local

